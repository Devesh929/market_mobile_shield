name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Bundle React Native JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Commit and Push APK to Repository
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/app-debug.apk apks/MarketShield-Demo.apk
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add apks/MarketShield-Demo.apk
          git commit -m "Automated build: Add bundled APK" || echo "No changes to commit"
          git push origin main
